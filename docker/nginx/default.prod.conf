# Este archivo gobierna el Nginx del servidor de producción.

# Este upstream define el backend FastCGI que ejecuta Laravel dentro del contenedor PHP.
upstream php_cluster {
    # Este backend apunta al servicio `php` del `docker compose` usando el puerto de PHP-FPM.
    server php:9000 max_fails=3 fail_timeout=30s;
    # Si en el futuro publicas varias réplicas manuales, aquí podrías agregar más servidores.
    # server php:9000;
    # server php:9000;
    # Este keepalive mantiene conexiones FastCGI reutilizables para reducir latencia.
    keepalive 32;
}

# Este bloque atiende HTTP plano sólo para health checks y redirecciones a HTTPS.
server {
    # Este `listen` recibe tráfico HTTP estándar en el puerto 80.
    listen 80 default_server;
    # Este `server_name` cubre ambos dominios reales y además cualquier request que no matchee otro host.
    server_name _ cap-erp-admin.com cap-erp-ecommerce.com;

    # Este endpoint responde al health check local de Docker sin forzar HTTPS.
    location = /health {
        # Desactivar access log evita ruido en los logs por chequeos frecuentes.
        access_log off;
        # Esta respuesta simple permite validar que Nginx sigue vivo desde fuera y desde Docker.
        return 200 "healthy\n";
        # Esta cabecera deja claro que la respuesta es texto plano.
        add_header Content-Type text/plain;
    }

    # Cualquier otra request HTTP se redirige al mismo host pero por HTTPS.
    location / {
        # Esta redirección conserva dominio y path para no romper enlaces o rutas compartidas.
        return 301 https://$host$request_uri;
    }
}

# Este bloque HTTPS sirve el panel Laravel en el dominio del administrador.
server {
    # Este `listen` habilita TLS en el puerto estándar 443.
    listen 443 ssl;
    # Esta directiva activa HTTP/2 con la sintaxis recomendada por Nginx 1.27+.
    http2 on;
    # Este `server_name` limita este bloque al dominio productivo del admin.
    server_name cap-erp-admin.com;

    # Este certificado debe cubrir el dominio del admin, ya sea por SAN o wildcard.
    ssl_certificate /etc/nginx/ssl/certificate.crt;
    # Esta clave privada corresponde al certificado cargado arriba.
    ssl_certificate_key /etc/nginx/ssl/private.key;

    # Estas versiones SSL/TLS deshabilitan protocolos antiguos inseguros.
    ssl_protocols TLSv1.2 TLSv1.3;
    # Este set de cifrados prioriza algoritmos modernos y compatibles.
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    # Esta opción deja que cliente y servidor negocien el mejor cifrado sin forzar uno obsoleto.
    ssl_prefer_server_ciphers off;
    # Esta cache reduce el costo de renegociar sesiones TLS repetidas.
    ssl_session_cache shared:SSL:10m;
    # Este timeout define cuánto dura una sesión TLS reutilizable.
    ssl_session_timeout 10m;

    # Este root expone sólo la carpeta pública de Laravel, no el proyecto completo.
    root /var/www/html/Laravel_app/public;
    # Estos índices cubren la entrada PHP y una eventual página estática de fallback.
    index index.php index.html;
    # Este límite controla el tamaño máximo de subida permitido en producción.
    client_max_body_size 50M;

    # Este header evita que el sitio se renderice embebido en iframes ajenos.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Este header reduce interpretaciones MIME erróneas por parte del navegador.
    add_header X-Content-Type-Options "nosniff" always;
    # Este header deja una política XSS heredada para navegadores que aún la leen.
    add_header X-XSS-Protection "1; mode=block" always;
    # Este header controla cuánta referencia envía el navegador a otros sitios.
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # Esta CSP base limita el origen por defecto y permite inline/data sólo donde ya lo exige la app.
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Gzip reduce el tamaño de respuestas textuales frecuentes.
    gzip on;
    # Esta opción añade la cabecera Vary para caches intermedios.
    gzip_vary on;
    # Este mínimo evita comprimir respuestas demasiado pequeñas.
    gzip_min_length 1024;
    # Estos tipos cubren la mayoría de respuestas textuales útiles de Laravel.
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Este bloque sirve archivos si existen y, si no, delega el routing a Laravel.
    location / {
        # `try_files` evita pasar a PHP archivos estáticos reales y mantiene las rutas amigables del framework.
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Este bloque ejecuta los scripts PHP mediante FastCGI.
    location ~ \.php$ {
        # Estos parámetros son la base de comunicación entre Nginx y PHP-FPM.
        include fastcgi_params;
        # Esta directiva envía la ejecución al backend `php_cluster` definido arriba.
        fastcgi_pass php_cluster;
        # Este index define el script por defecto cuando una ruta termina en directorio.
        fastcgi_index index.php;

        # Este valor informa a PHP-FPM la ubicación física exacta del script pedido.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Este valor conserva el `PATH_INFO` para rutas o frameworks que lo necesitan.
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Este timeout tolera respuestas lentas de procesos pesados sin cortar la conexión demasiado pronto.
        fastcgi_read_timeout 120s;
        # Este timeout controla cuánto puede tardar Nginx en enviar la request completa a PHP-FPM.
        fastcgi_send_timeout 120s;
        # Este timeout limita cuánto espera Nginx para conectarse al backend PHP.
        fastcgi_connect_timeout 60s;

        # Este tamaño ajusta el buffer inicial de respuesta FastCGI.
        fastcgi_buffer_size 32k;
        # Esta cantidad define buffers auxiliares para respuestas medianas.
        fastcgi_buffers 4 32k;
        # Este valor reserva espacio para buffers ocupados durante respuestas grandes.
        fastcgi_busy_buffers_size 64k;

        # Aquí podrías activar FastCGI cache si luego identificas páginas seguras para cachear.
        # fastcgi_cache_bypass $skip_cache;
        # fastcgi_no_cache $skip_cache;
        # fastcgi_cache PHPCACHE;
        # fastcgi_cache_valid 200 60m;
    }

    # Este bloque fuerza que las rutas de Livewire también vuelvan a Laravel cuando no existan como archivos.
    location ^~ /livewire {
        # Este fallback evita que Livewire se rompa por rutas dinámicas o assets publicados parcialmente.
        try_files $uri /index.php?$query_string;
    }

    # Este bloque cachea imágenes y otros assets estáticos pesados por largo tiempo.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        # Esta expiración larga mejora tiempos de carga y descarga repetida.
        expires 365d;
        # Esta cabecera permite caches agresivas para archivos versionados.
        add_header Cache-Control "public, immutable";
        # Desactivar access log evita ruido por cada asset estático solicitado.
        access_log off;
        # Esta validación evita entregar recursos inexistentes vía Laravel.
        try_files $uri =404;
    }

    # Este bloque aplica cache larga a CSS y JS servidos directamente desde disco.
    location ~* \.(css|js)$ {
        # Esta expiración favorece performance sin recargar el backend.
        expires 30d;
        # Esta cabecera comunica que los archivos versionados pueden considerarse inmutables.
        add_header Cache-Control "public, immutable";
        # Desactivar access log mantiene más limpios los logs de aplicación.
        access_log off;
        # Esta validación responde 404 real si el asset no está presente.
        try_files $uri =404;
    }

    # Este bloque niega archivos ocultos sensibles como `.env` o metadatos Git.
    location ~ /\.(ht|git|env) {
        # Este deny corta el acceso antes de tocar Laravel o PHP.
        deny all;
    }

    # Este bloque bloquea cualquier archivo oculto restante excepto `.well-known` para certificados.
    location ~ /\.(?!well-known).* {
        # Este deny protege archivos de sistema que no deben salir por web.
        deny all;
    }

    # Este bloque bloquea carpetas internas del framework que nunca deben ser públicas.
    location ~ ^/(storage|bootstrap/cache) {
        # Este deny evita exponer caches, sesiones o archivos sensibles del runtime.
        deny all;
    }

    # Este access log separado simplifica auditar tráfico del panel administrativo.
    access_log /var/log/nginx/erp_access.log;
    # Este error log separado deja warnings y errores del admin en un archivo estable.
    error_log /var/log/nginx/erp_error.log warn;
}

# Este bloque HTTPS sirve la SPA de Vue compilada en su propio dominio productivo.
server {
    # Este `listen` habilita TLS para el frontend público en el puerto estándar 443.
    listen 443 ssl;
    # Esta directiva activa HTTP/2 con la sintaxis moderna recomendada por Nginx.
    http2 on;
    # Este `server_name` reserva este bloque para el dominio ecommerce público.
    server_name cap-erp-ecommerce.com;

    # Este certificado debe cubrir también el dominio del frontend público.
    ssl_certificate /etc/nginx/ssl/certificate.crt;
    # Esta clave privada corresponde al mismo bundle TLS cargado arriba.
    ssl_certificate_key /etc/nginx/ssl/private.key;

    # Estas versiones TLS se mantienen alineadas con el bloque del admin.
    ssl_protocols TLSv1.2 TLSv1.3;
    # Este set de cifrados replica la política fuerte usada por el admin.
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    # Esta opción deja la preferencia final al algoritmo negociado más seguro disponible.
    ssl_prefer_server_ciphers off;
    # Esta cache reutiliza sesiones TLS para bajar latencia.
    ssl_session_cache shared:SSL:10m;
    # Este timeout define cuánto tiempo reaprovechar sesiones TLS.
    ssl_session_timeout 10m;

    # Este root apunta al `dist` compilado de Vue que el workflow de producción sube al servidor.
    root /var/www/html/Vue_app/dist;
    # Este index sirve la entrada principal de la SPA cuando se abre el dominio base.
    index index.html;

    # Este header evita iframes cruzados no deseados también en el frontend público.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Este header reduce sniffing MIME incorrecto para assets estáticos.
    add_header X-Content-Type-Options "nosniff" always;
    # Este header conserva compatibilidad XSS heredada en navegadores antiguos.
    add_header X-XSS-Protection "1; mode=block" always;
    # Este header controla el referrer enviado desde la SPA.
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip también se habilita en la SPA para reducir JS, CSS y JSON servidos estáticamente.
    gzip on;
    # Esta opción añade `Vary: Accept-Encoding` a respuestas comprimidas.
    gzip_vary on;
    # Esta longitud mínima evita comprimir respuestas muy pequeñas.
    gzip_min_length 1024;
    # Estos tipos cubren los recursos típicos del build de Vue.
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Este bloque sirve archivos estáticos y hace fallback a `index.html` para el router SPA.
    location / {
        # `try_files` primero intenta servir el archivo real y, si no existe, devuelve la SPA para rutas internas.
        try_files $uri $uri/ /index.html;
    }

    # Este bloque cachea los assets estáticos versionados del build de Vue.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        # Esta expiración larga mejora la entrega de bundles con hash en el nombre.
        expires 30d;
        # Esta cabecera permite al navegador cache agresivamente esos archivos versionados.
        add_header Cache-Control "public, immutable";
        # Desactivar access log reduce ruido por cada asset descargado.
        access_log off;
        # Esta validación devuelve 404 real si el asset falta en el `dist` desplegado.
        try_files $uri =404;
    }

    # Este access log separado facilita diferenciar tráfico del ecommerce público del admin.
    access_log /var/log/nginx/ecommerce_access.log;
    # Este error log separado deja los errores del frontend compilado en su propio archivo.
    error_log /var/log/nginx/ecommerce_error.log warn;
}
