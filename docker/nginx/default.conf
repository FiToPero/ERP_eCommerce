
## Este upstream define el destino FastCGI que ejecuta el código PHP de Laravel.
upstream php_cluster {
    ## Este servidor interno apunta al servicio `php` del `docker compose` en el puerto 9000.
    server php:9000;
}

## Este upstream define el servidor Vite de Laravel para servir assets y HMR en desarrollo.
upstream laravel_vite {
    ## Este servidor interno apunta al servicio `node` que ejecuta `npm run dev` para Laravel.
    server node:5173;
}

## Este upstream define el servidor Vite de la SPA de Vue para servir la app en desarrollo.
upstream vue_frontend {
    ## Este servidor interno apunta al servicio `vue` que expone el proyecto Vue en el puerto 5174.
    server vue:5174;
}

## Este bloque atiende el panel/admin de Laravel usando un dominio dedicado sin puerto en la URL.
server {
    ## Este `listen` hace que Nginx reciba tráfico HTTP estándar por el puerto 80.
    listen 80;
    ## Este `server_name` limita este bloque al hostname del entorno de desarrollo para Laravel.
    server_name cap-erp-admin-dev.com;
    ## Este `root` define la carpeta pública de Laravel, que es la única que debe exponerse por web.
    root /var/www/html/Laravel_app/public;
    ## Este `index` indica qué archivos usar cuando se solicita un directorio.
    index index.php index.html;
    ## Este límite permite subir archivos grandes desde el panel sin tocar PHP todavía.
    client_max_body_size 100M;

    ## Este bloque enruta el cliente HMR de Vite hacia el contenedor `node` usando el mismo dominio público.
    location ^~ /@vite {
        ## Este proxy reenvía la request al servidor Vite interno de Laravel.
        proxy_pass http://laravel_vite;
        ## Este header conserva el hostname original para que Vite genere URLs coherentes.
        proxy_set_header Host $host;
        ## Este header preserva la IP real del cliente para logs y depuración.
        proxy_set_header X-Real-IP $remote_addr;
        ## Este header conserva la cadena de proxies por si luego agregas otro balanceador.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        ## Este header indica a Vite si la request pública llegó por HTTP o HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        ## Esta versión HTTP es necesaria para que los upgrades de websocket funcionen bien.
        proxy_http_version 1.1;
        ## Este header habilita el upgrade de conexión para el websocket de HMR.
        proxy_set_header Upgrade $http_upgrade;
        ## Este header acompaña el upgrade y mantiene viva la sesión websocket.
        proxy_set_header Connection "upgrade";
    }

    ## Este bloque expone los módulos fuente de Laravel Vite bajo el mismo dominio del admin.
    location ^~ /resources/ {
        ## Este proxy manda los módulos JS y CSS sin compilar al servidor Vite interno.
        proxy_pass http://laravel_vite;
        ## Este header conserva el host visible desde el navegador.
        proxy_set_header Host $host;
        ## Este header mantiene la IP real del visitante.
        proxy_set_header X-Real-IP $remote_addr;
        ## Este header preserva la cadena completa de proxies.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        ## Este header informa el esquema público de la request.
        proxy_set_header X-Forwarded-Proto $scheme;
        ## Esta versión HTTP evita problemas con el streaming de módulos durante el desarrollo.
        proxy_http_version 1.1;
        ## Este header permite upgrades si algún plugin de Vite los necesita.
        proxy_set_header Upgrade $http_upgrade;
        ## Este header asegura compatibilidad con conexiones persistentes y upgrades.
        proxy_set_header Connection "upgrade";
    }

    ## Este bloque cubre dependencias transformadas por Vite para que también salgan por el mismo host.
    location ^~ /node_modules/ {
        ## Este proxy reenvía los assets transformados al servidor Vite de Laravel.
        proxy_pass http://laravel_vite;
        ## Este header conserva el host público original.
        proxy_set_header Host $host;
        ## Este header preserva la IP del cliente.
        proxy_set_header X-Real-IP $remote_addr;
        ## Este header conserva el historial de proxies.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        ## Este header mantiene el esquema real usado por el visitante.
        proxy_set_header X-Forwarded-Proto $scheme;
        ## Esta versión HTTP es la adecuada para el tráfico del dev server.
        proxy_http_version 1.1;
        ## Este header deja habilitado el upgrade cuando Vite lo requiere.
        proxy_set_header Upgrade $http_upgrade;
        ## Este header acompaña el upgrade de conexión.
        proxy_set_header Connection "upgrade";
    }

    ## Este bloque atiende el endpoint websocket exclusivo que usará Laravel Vite para HMR.
    location ^~ /vite-hmr {
        ## Este proxy apunta al mismo path dentro del contenedor `node` para el canal HMR.
        proxy_pass http://laravel_vite/vite-hmr;
        ## Este header conserva el hostname visible para el cliente.
        proxy_set_header Host $host;
        ## Este header conserva la IP real del navegador.
        proxy_set_header X-Real-IP $remote_addr;
        ## Este header encadena correctamente los proxies previos.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        ## Este header informa si la conexión pública llegó por HTTP o HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        ## Esta versión HTTP es obligatoria para websocket.
        proxy_http_version 1.1;
        ## Este header solicita el upgrade a websocket.
        proxy_set_header Upgrade $http_upgrade;
        ## Este header confirma que la conexión debe actualizarse.
        proxy_set_header Connection "upgrade";
    }

    ## Este bloque gestiona cualquier ruta normal del panel Laravel.
    location / {
        ## `try_files` sirve un archivo estático si existe y, si no, delega en `index.php` para Laravel.
        try_files $uri $uri/ /index.php?$query_string;
    }

    ## Este bloque procesa scripts PHP mediante PHP-FPM.
    location ~ \.php$ {
        ## Este include carga los parámetros FastCGI estándar que PHP necesita.
        include fastcgi_params;
        ## Este pass envía la ejecución al upstream `php_cluster` definido arriba.
        fastcgi_pass php_cluster;
        ## Este index define el archivo de entrada por defecto cuando la ruta termina en directorio.
        fastcgi_index index.php;

        ## Este parámetro indica a PHP-FPM la ruta física exacta del script a ejecutar.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        ## Este parámetro mantiene disponible el `PATH_INFO` para frameworks que lo usan.
        fastcgi_param PATH_INFO $fastcgi_path_info;
        ## Este timeout evita cortar respuestas largas del backend durante tareas pesadas del admin.
        fastcgi_read_timeout 300;
    }

    ## Este bloque da prioridad a Livewire para que sus endpoints sigan pasando por Laravel.
    location ^~ /livewire {
        ## Esta regla hace fallback a `index.php` para mantener el enrutamiento de Livewire.
        try_files $uri /index.php?$query_string;
    }

    ## Este bloque sirve assets estáticos comunes desde disco con cache del navegador.
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        ## Esta cabecera pide al navegador conservar estos recursos 30 días.
        expires 30d;
        ## Esta cabecera marca los assets como públicos e inmutables para mejorar performance.
        add_header Cache-Control "public, immutable";
        ## Esta validación evita enviar requests inexistentes a Laravel innecesariamente.
        try_files $uri =404;
    }

    ## Este bloque bloquea cualquier intento de acceder a archivos ocultos tipo `.htaccess`.
    location ~ /\.ht {
         ## Esta instrucción corta el acceso por seguridad.
         deny all;
    }
}

## Este bloque atiende la SPA de Vue en desarrollo con su propio dominio sin puerto explícito.
server {
    ## Este `listen` hace que la SPA comparta el puerto HTTP estándar con el admin.
    listen 80;
    ## Este `server_name` asigna este bloque exclusivamente al dominio público del frontend de desarrollo.
    server_name cap-erp-ecommerce-dev.com;

    ## Este bloque reenvía toda la SPA al dev server de Vue para mantener HMR y routing del lado cliente.
    location / {
        ## Este proxy manda todas las requests al upstream `vue_frontend` definido arriba.
        proxy_pass http://vue_frontend;
        ## Este header conserva el host público visible desde el navegador.
        proxy_set_header Host $host;
        ## Este header preserva la IP real del cliente para logs y debugging.
        proxy_set_header X-Real-IP $remote_addr;
        ## Este header mantiene el historial de proxies previos.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        ## Este header informa el esquema público con el que llegó la request.
        proxy_set_header X-Forwarded-Proto $scheme;
        ## Esta versión HTTP permite upgrades websocket para HMR.
        proxy_http_version 1.1;
        ## Este header habilita el upgrade a websocket cuando Vite lo solicita.
        proxy_set_header Upgrade $http_upgrade;
        ## Este header acompaña el upgrade para la conexión persistente.
        proxy_set_header Connection "upgrade";
    }
}

