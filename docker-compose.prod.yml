# docker-compose.prod.yml
# Configuración para PRODUCCIÓN (rama main)
# Uso: docker compose -f docker-compose.prod.yml up -d

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    #image: ${PHP_IMAGE:-fitopero/php_apache_without_node_for_nginx:v1}
    volumes:
      - .:/var/www/html
      - type: bind
        source: ./ERP_storage/public
        target: /var/www/html/Laravel_app/storage/app/public
        bind:
          create_host_path: false
      - ./docker/php/product-uploads.ini:/usr/local/etc/php/conf.d/zz-product-uploads.ini:ro
    depends_on:
      - db
      - redis
    user: "1000:1000"
    networks:
      - network_app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      PHP_OPCACHE_ENABLE: 1
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 0
      PHP_OPCACHE_REVALIDATE_FREQ: 0
      PHP_OPCACHE_MAX_ACCELERATED_FILES: 20000
      PHP_OPCACHE_MEMORY_CONSUMPTION: 256
    deploy:
      replicas: 2  # Load balancing con 2 instancias PHP
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 512M
      placement:
        constraints:
          - node.role == manager
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # NO incluir servicios node/vue en producción
  # Los assets ya están compilados con npm run build

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
    networks:
      - network_app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html:ro  # Read-only para seguridad
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro  # Certificados SSL
      - type: bind
        source: ./ERP_storage/public
        target: /var/www/html/Laravel_app/storage/app/public
        read_only: true
        bind:
          create_host_path: false
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      placement:
        constraints:
          - node.role == manager
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    networks:
      - network_app
    restart: unless-stopped
    # NO exponer puerto 5432 en producción (solo acceso interno)
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - db_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          cpus: "2"
          memory: 2048M
        reservations:
          cpus: "1"
          memory: 1024M
      placement:
        constraints:
          - node.role == manager
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    networks:
      - network_app
    restart: unless-stopped
    # NO exponer puerto 6379 en producción
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Mailpit NO se incluye en producción (usar SMTP real)
  # Configurar MAIL_MAILER=smtp con credenciales reales en .env

volumes:
  db_data:

# En producción, usar overlay network para Swarm (opcional)
networks:
  network_app:
    driver: bridge  # Cambiar a 'overlay' si usas Docker Swarm
