# docker-compose.dev.yml
# Configuración para DESARROLLO (rama develop)
# Uso: docker compose -f docker-compose.dev.yml --profile dev up -d

services:
  php:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: fitopero/erp_php84_26:latest
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - redis
    user: "1000:1000"
    networks:
      - network_app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      # Desactivar Opcache evita que PHP conserve código viejo en memoria mientras editas.
      PHP_OPCACHE_ENABLE: 0
      # Esta opción obliga a PHP a revisar cambios en archivos en cada request.
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 1
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  node:
    image: node:24-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    # Este comando levanta el dev server de Vite para los assets de Laravel.
    command: sh -c "cd Laravel_app && npm install && npm run dev"
    networks:
      - network_app

  vue_ecommerce:
    image: node:24-alpine
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./Vue_ecommerce_app:/app
    # Este comando levanta el dev server de la SPA de Vue escuchando en todas las interfaces internas.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    networks:
      - network_app

  vue_ventas:
    image: node:24-alpine
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./Vue_ventas_app:/app
    # Este comando levanta el dev server de la SPA de Vue escuchando en todas las interfaces internas.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5175"
    networks:
      - network_app

  nginx:
    image: nginx:1.27-alpine
    networks:
      - network_app
    # Se publican los puertos 80 y 443 porque el admin usa cookies `secure` y necesita HTTPS incluso en dev.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl/dev:/etc/nginx/ssl:ro  # Certificado autofirmado para HTTPS local
    depends_on:
      - php
      - node
      - vue_ecommerce
      - vue_ventas
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"  # Expuesto para herramientas externas (pgAdmin, DBeaver)
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=es_ES.UTF-8 --lc-ctype=es_ES.UTF-8"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - network_app
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"  # Expuesto para Redis Commander
    networks:
      - network_app
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - network_app
    profiles:
      - dev

volumes:
  db_data:

networks:
  network_app:
    driver: bridge
